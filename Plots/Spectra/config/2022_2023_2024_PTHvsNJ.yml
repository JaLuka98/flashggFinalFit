frame1:
  axvline:
    - x: 100
      color: "black"
      ls: "-"
      lw: 1
      alpha: 1
    - x: 200
      color: "black"
      ls: "-"
      lw: 1
      alpha: 1
  ylabel:
    text: '$\Delta\sigma_{\mathrm{fid}} / \Delta p_{t}$ (fb/GeV)'
    fontsize: 20
  ylim:
    bottom: 0.001
    top: 100
  additional_labels:
    - text: '$n_{\mathrm{jets}}=0$'
      position: [28, 0.7]
      rotation: 0
      fontsize: 18
    - text: '$n_{\mathrm{jets}}=1$'
      position: [128, 0.7]
      rotation: 0
      fontsize: 18
    - text: '$n_{\mathrm{jets}}\geq2$'
      position: [228, 0.7]
      rotation: 0
      fontsize: 18
  fontsize: 13
  title_fontsize: 13

