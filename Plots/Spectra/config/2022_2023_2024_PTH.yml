lumi: 171.4
equal_width_bins: True # every p_T^H bin drawn with the same width, labelled with the real bin edges

frame1:
  ylabel:
    text: '$\Delta\sigma_{\text{fid}} / \Delta p_{T}^{H}$ (fb/GeV)'
    fontsize: 20
  legend_location: 'lower left'
  fontsize: 14
  title_fontsize: 14

frame2:
  # tick at every bin edge; the last bin (> 450 GeV) is the overflow bin
  xticks: [0, 5, 10, 15, 20, 25, 30, 35, 45, 60, 80, 100, 120, 140, 170, 200, 250, 350, 450, 550]
  xtick_labels: ["0", "5", "10", "15", "20", "25", "30", "35", "45", "60", "80", "100", "120", "140", "170", "200", "250", "350", "450", "$\\infty$"]
  xtick_fontsize: 14
  xtick_rotation: 45
  ylim: [0, 2]
  yticks:
    is_data: [0, 1, 2, 3]
    not_data: [0, 0.5, 1, 1.5, 2]
  ytick_labels:
    is_data: ["0.0", "1.0", "2.0", "3.0"]
    not_data: ["0.0", "0.5", "1.0", "1.5", "2.0"]
