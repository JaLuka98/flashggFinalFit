# Config file: 2022+2023+2024 |y_H| fits on the combined Hgg+H4l (HIG-26-007) datacards.
# Only the Combine steps are configured: the datacard/workspace are taken from the datacards repo
# (see output_asimov_rapidity_HggH4l/run_asimov_rapidity_HggH4l.sh), so no Trees2WS/Signal/Background inputs.

outputFolder: '/.automount/net_rw/net__data_cms3a-1/daumann/PhD/Final_fits_repo/CMSSW_14_1_0_pre4/src/flashggFinalFit_hig19016_combination/output_asimov_rapidity_HggH4l/comb/'

backgroundScriptCfg:
  cats: 'auto'
  catOffset: 0
  ext: 'Run3FidXSAnalysis_rapidity'
  execution: 'htcondor'
  batchPartition: "short"
  batchMemory: 4000
  batchMaxRuntime: "01:00:00"

datacard:
  prune: True
  pruneThreshold: 0.001
  doTrueYield: True
  analysis: 'Run3FidXSAnalysis'
  skipCOWCorr: True
  doSystematics: True
  doMCStatUncertainty: True
  doSTXSMerging: False
  doSTXSScaleCorrelationScheme: False
  saveDataFrame: False
  output: 'Datacard_rapidity_2022_2023_2024'

combine_fit:
  asimov_numPoints: 40 # Number of points the Asimov generator should generate for the NLL scan
  unblindedFit_numPoints: 100
  setParameterRange: "r=0,3"
  execution: 'htcondor'
  batchPartition: "short"
  batchMemory: 6000 # MB, the combined Hgg+H4l workspace is large
  batchMaxRuntime: "04:00:00"

combine_impacts:
  exclude: ""
  not_show_POI: True
  execution: 'htcondor'
  batchPartition: "short"
  batchMemory: 12000
  batchMaxRuntime: "08:00:00"

combine_hesse:
  execution: 'htcondor'
  batchPartition: "short"
  batchMemory: 6000
  batchMaxRuntime: "04:00:00"

combine_mggToys:
  nToys: 1000
  loadSnapshot: 'MultiDimFit'
  doBands: True
  execution: 'htcondor'
  batchPartition: "short"
  batchMemory: 4000
  batchMaxRuntime: "01:00:00"

spectra:
  no_preliminary: True
  private_work : False
  ggh_xs: "fidXS_YH_ggH"
  vbf_xs: "fidXS_YH_VBFH"
  vh_xs: "fidXS_YH_VH"
  tth_xs: "fidXS_YH_ttH"
  xh_xs: "fidXS_YH_xH"
  ggh_powheg_xs: "fidXS_YH_ggH_powheg"
  ggh_no_nnlops_xs: "fidXS_YH_ggH_genWeight"
  underflow_bin_normalized: False
  last_bin_center: 0
  first_bin_center: 0.075
  plot_log: 0
  variable: "|y^H|"
  y_unit: "(fb)"
  x_unit: ""
  x_lim: [0, 2.5]
  y_lim: [0,2.75]

combined_spectra:
  # Output directories of the three fits (can be overridden with --hgg-output-dir etc.)
  hgg_output_dir: '/.automount/net_rw/net__data_cms3a-1/daumann/PhD/Final_fits_repo/CMSSW_14_1_0_pre4/src/flashggFinalFit_hig19016_combination/output_asimov_rapidity_HggH4l/hgg/'
  hzz_output_dir: '/.automount/net_rw/net__data_cms3a-1/daumann/PhD/Final_fits_repo/CMSSW_14_1_0_pre4/src/flashggFinalFit_hig19016_combination/output_asimov_rapidity_HggH4l/h4l/'
  comb_output_dir: '/.automount/net_rw/net__data_cms3a-1/daumann/PhD/Final_fits_repo/CMSSW_14_1_0_pre4/src/flashggFinalFit_hig19016_combination/output_asimov_rapidity_HggH4l/comb/'
  # The fidXS modules in `spectra` are Hgg fiducial sigma x BR. Set prediction_scale (and frame1.ylabel in
  # Plots/Spectra/config/<year>_<variable>.yml) to show
  # another normalisation (e.g. the total cross section); the ratio panel is unaffected.
  prediction_scale: 1.
  prediction_label: 'aMC@NLO NNLOPS + xH'
  hgg_label: 'H$\rightarrow\gamma\gamma$'
  hzz_label: 'H$\rightarrow$ZZ$\rightarrow$4$\ell$'
  comb_label: 'H$\rightarrow\gamma\gamma$ + H$\rightarrow$ZZ'
  expected_title: 'Expected (Asimov)'
  overflow_width_as_previous: False # True for PTH/PTJ0: last (overflow) bin drawn with the width of the last but one bin
  # ggh_xs/vbf_xs/vh_xs/tth_xs: override the spectra prediction modules, e.g. with total cross sections per bin
